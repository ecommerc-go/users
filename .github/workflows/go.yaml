name: Go

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.5' 
          cache-dependency-path: go.sum

      - name: Сборка
        run: go build -o ./bin/ -v ./...

      - name: Тестирование
        run: go test -v ./...

  linter:
    name: Линтер
    runs-on: ubuntu-latest
    needs: build-and-test 
    steps:
      - uses: actions/checkout@v4
      
      - name: Установка Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.5' 
          cache-dependency-path: go.sum
      - name: Запуск golangci-lint
        uses: golangci/golangci-lint-action@v3  
        with:
          version: v1.59.0 
          args: --timeout=30m